<!-- KỊCH BẢN LOGIC KẾT NỐI (JS) -->

<script>
    // ---------------------------------------------------------
    // 1. TÍNH NĂNG CHUYỂN ĐỔI GIAO DIỆN SÁNG / TỐI HỢP NHẤT
    // ---------------------------------------------------------
    window.initTheme = function() {
        const savedTheme = localStorage.getItem('app_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        window.updateThemeIcon(savedTheme);
    };

    window.toggle_light_mode = function() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('app_theme', newTheme);
        window.updateThemeIcon(newTheme);
    };
    
    // Gắn bí danh để nút cũ (toggleTheme) và nút mới (toggle_light_mode) đều dùng chung 1 lõi
    window.toggleTheme = window.toggle_light_mode;

    window.updateThemeIcon = function(theme) {
        // Quét và cập nhật TẤT CẢ icon mặt trăng/mặt trời trên màn hình (nút nổi & nút trên thanh Header)
        const icons = document.querySelectorAll('.bi-moon-stars-fill, .bi-sun-fill');
        icons.forEach(icon => {
            if(theme === 'light') {
                icon.className = 'bi bi-sun-fill text-warning';
            } else {
                icon.className = 'bi bi-moon-stars-fill text-info';
            }
        });
    };
    window.initTheme(); // Chạy ngay khi mở trang

    // ---------------------------------------------------------
    // 2. KHỞI TẠO ĐỘNG CƠ SUPABASE VÀ BẮT SỰ KIỆN ENTER
    // ---------------------------------------------------------
    const supabaseUrl = 'https://rstwrqzuoivfcymjvdmp.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJzdHdycXp1b2l2ZmN5bWp2ZG1wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3NjcyNjYsImV4cCI6MjEwNTM0MzI2Nn0.WJzvT9T7JuJ6uiIuvzWcRpcKON3IFaBNwQgD8gEQWqc';
    const db = supabase.createClient(supabaseUrl, supabaseKey);

    window.db = db;
    // Gắn phím Enter để đăng nhập nhanh
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            const loginScreen = document.getElementById('login_screen');
            if (loginScreen && loginScreen.style.display !== 'none') { 
                e.preventDefault(); 
                if (typeof window.check_access === 'function') window.check_access(); 
            }
        }
    });
</script>
