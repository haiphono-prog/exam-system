<script>
    // ---------------------------------------------------------
    // 1. TÍNH NĂNG CHUYỂN ĐỔI GIAO DIỆN SÁNG / TỐI HỢP NHẤT
    // ---------------------------------------------------------
    window.initTheme = function() {
        const savedTheme = localStorage.getItem('app_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        window.updateThemeIcon(savedTheme);
    };

    window.toggle_light_mode = function() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('app_theme', newTheme);
        window.updateThemeIcon(newTheme);
    };
    
    // Gắn bí danh để nút cũ (toggleTheme) và nút mới (toggle_light_mode) đều dùng chung 1 lõi
    window.toggleTheme = window.toggle_light_mode;

    window.updateThemeIcon = function(theme) {
        // Quét và cập nhật TẤT CẢ icon mặt trăng/mặt trời trên màn hình (nút nổi & nút trên thanh Header)
        const icons = document.querySelectorAll('.bi-moon-stars-fill, .bi-sun-fill');
        icons.forEach(icon => {
            if(theme === 'light') {
                icon.className = 'bi bi-sun-fill text-warning';
            } else {
                icon.className = 'bi bi-moon-stars-fill text-info';
            }
        });
    };
    window.initTheme(); // Chạy ngay khi mở trang

    const db = supabase.createClient(supabaseUrl, supabaseKey);

    window.db = db;
    // Gắn phím Enter để đăng nhập nhanh
